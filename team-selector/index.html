<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Team Selector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--sunk:#E9EDF3;--ink:#141B2D;--muted:#5A6379;--line:#D9DEE7;
  --accent:#1D4ED8;--accent-ink:#FFFFFF;--accent-soft:#E3EAFD;
  --pitch:#E4EEE7;--pitch-line:#B9CFC0;
  --good:#17835A;--bad:#C23A2B;--warn:#A86A12;--good-soft:#DDF1E7;--bad-soft:#F8E1DE;--warn-soft:#F6EAD6;
  --r-gk:#C98300;--r-def:#1D4ED8;--r-mid:#0E8C7E;--r-wing:#7A5AF8;--r-for:#D0336B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0D1220;--surface:#151C2E;--sunk:#10172A;--ink:#E7EBF3;--muted:#97A1B6;--line:#273149;
  --accent:#7C9DFF;--accent-ink:#0D1220;--accent-soft:#1E2A4A;
  --pitch:#12231B;--pitch-line:#2A4A38;
  --good:#45C08A;--bad:#F0735F;--warn:#E0A84A;--good-soft:#16342A;--bad-soft:#3A1E1C;--warn-soft:#3A2C16;
  --r-gk:#F2B233;--r-def:#7C9DFF;--r-mid:#3CC6B4;--r-wing:#A792FF;--r-for:#F2709B;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1220;--surface:#151C2E;--sunk:#10172A;--ink:#E7EBF3;--muted:#97A1B6;--line:#273149;
  --accent:#7C9DFF;--accent-ink:#0D1220;--accent-soft:#1E2A4A;
  --pitch:#12231B;--pitch-line:#2A4A38;
  --good:#45C08A;--bad:#F0735F;--warn:#E0A84A;--good-soft:#16342A;--bad-soft:#3A1E1C;--warn-soft:#3A2C16;
  --r-gk:#F2B233;--r-def:#7C9DFF;--r-mid:#3CC6B4;--r-wing:#A792FF;--r-for:#F2709B;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;display:grid;gap:22px}
.wrap{grid-template-columns:minmax(0,1fr)}
.wrap>*,.plan>*,.xi>*{min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:24px;line-height:1.1}
h3{font-size:18px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:grid;gap:6px}
.brand .crest{display:inline-flex;align-items:center;gap:10px}
.crest i{width:14px;height:22px;border-radius:3px 3px 7px 7px;background:var(--accent);display:inline-block}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sunk);font-size:13px;white-space:nowrap}
.pill b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.upload{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:6px}
.drop label{font-weight:600}
.notice{border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.notice .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.notice.early{background:var(--warn-soft)} .notice.early .dot{background:var(--warn)}
.notice.building{background:var(--accent-soft)} .notice.building .dot{background:var(--accent)}
.notice.solid{background:var(--good-soft)} .notice.solid .dot{background:var(--good)}
.notice.err{background:var(--bad-soft)} .notice.err .dot{background:var(--bad)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;max-width:360px}
.meter span{display:block;height:100%;background:currentColor}
.plan{display:grid;gap:14px}
.opt{display:inline-flex;align-items:center;gap:8px}
.newtag{font:600 11px/1 var(--body);margin-left:6px;padding:2px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.chip[aria-pressed="true"] .newtag{background:var(--accent-ink);color:var(--accent)}
.grid td,.grid th{padding:6px 6px}
.xi{display:grid;gap:20px;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:820px){.xi{grid-template-columns:minmax(0,1fr)}}
select.btn{max-width:100%}
.xi>div,.wrap>section{grid-template-columns:minmax(0,1fr)}
.opt{max-width:100%;flex-wrap:wrap}
.pitch{position:relative;background:var(--pitch);border-radius:12px;aspect-ratio:3/4;max-width:100%;overflow:hidden;border:1px solid var(--pitch-line)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:3px;text-align:center;width:31%}
.spot .shirt{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--display);letter-spacing:.04em;color:#fff;background:var(--c);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.spot .nm{font:700 17px/1.05 var(--display);background:var(--surface);padding:2px 8px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .sc{font-size:12px;color:var(--muted)}
.spot.new .nm{outline:1.5px dashed var(--warn)}
.why{display:grid;gap:0}
.why .row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.why .row:last-child{border-bottom:0}
.tag{font:700 12px/1 var(--display);letter-spacing:.06em;padding:4px 6px;border-radius:5px;color:#fff;background:var(--c);text-align:center}
.avail{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font:700 17px/1 var(--display);letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;vertical-align:bottom}
th[data-sort]:hover{color:var(--ink)}
th.on{color:var(--ink)}
td.pos{color:var(--good);font-weight:600} td.neg{color:var(--bad);font-weight:600}
td .thin{color:var(--muted);font-weight:400;font-size:12px}
.roles{display:flex;height:10px;width:120px;border-radius:3px;overflow:hidden;background:var(--line)}
.roles span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.checks{display:grid;gap:14px}
.check h3{display:flex;gap:10px;align-items:center}
.count{font:600 12px/1 var(--body);padding:3px 8px;border-radius:999px;background:var(--sunk)}
.check ul{margin:6px 0 0;padding-left:18px;display:grid;gap:6px}
.check li select{max-width:100%}
.prose{max-width:68ch;display:grid;gap:10px}
.prose p{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:9}
@media (prefers-reduced-motion:no-preference){.spot{transition:left .35s ease,top .35s ease}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow crest"><i></i>Kew Park Rangers · Blues</span>
      <h1>Team Selector</h1>
    </div>
    <div class="status" id="status"></div>
  </header>

  

  <div class="bar">
    <span class="eyebrow">Seasons</span>
    <div class="seg" id="ages" role="group" aria-label="Seasons to include"></div>
    <span class="muted" id="scope"></span>
  </div>

  <div id="evidence"></div>

  <section class="plan" id="xiSec">
    <div style="display:grid;gap:6px">
      <h2>Match plan</h2>
      <p class="muted" style="margin:0;max-width:70ch">Pick the squad. The page plans all four quarters to give the best predicted goal difference, while sharing playing time as evenly as possible.</p>
    </div>
    <div class="avail" id="avail" role="group" aria-label="Squad for this match"></div>
    <div class="bar">
      <button class="btn" id="nextSquad" type="button" hidden>Use next match squad</button>
      <button class="btn" id="lastSquad" type="button">Use last match squad</button>
      <button class="btn" id="allPlayers" type="button">Select everyone</button>
    </div>
    <div class="bar opts">
      <label class="opt" for="keeperSel"><span class="eyebrow">Keeper</span><select id="keeperSel" class="btn"></select></label>
      <label class="opt" for="periodsSel"><span class="eyebrow">Changes</span><select id="periodsSel" class="btn"><option value="8">Half-way through each quarter</option><option value="4">Quarter breaks only</option></select></label>
      <label class="opt" for="chemW"><span class="eyebrow">Groupings</span><select id="chemW" class="btn"><option value="0">Ignore</option><option value="1">Normal weight</option><option value="2">Strong weight</option></select></label>
    </div>
    <p class="muted" id="unrated" style="margin:0;font-size:13px" hidden></p>
    <div id="planSummary"></div>
    <div class="xi">
      <div style="display:grid;gap:10px;align-content:start">
        <div class="seg" id="ptabs" role="tablist" aria-label="Show period on pitch"></div>
        <div class="pitch" id="pitch">
          <svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
            <g fill="none" stroke="var(--pitch-line)" stroke-width="2">
              <rect x="10" y="10" width="280" height="380" rx="4"/>
              <line x1="10" y1="200" x2="290" y2="200"/>
              <circle cx="150" cy="200" r="38"/>
              <rect x="80" y="10" width="140" height="58"/>
              <rect x="80" y="332" width="140" height="58"/>
            </g>
          </svg>
        </div>
      </div>
      <div style="display:grid;gap:10px;align-content:start">
        <div id="planGrid"></div>
        <div class="bar"><button class="btn" type="button" id="copyPlan">Copy plan</button><span class="muted" id="copyMsg" style="font-size:13px"></span></div>
        <textarea id="copyText" readonly hidden rows="6" style="width:100%;font:13px/1.4 ui-monospace,Menlo,monospace"></textarea>
        <div id="groupNote"></div>
      </div>
    </div>
    <details id="posEditor" class="panel">
      <summary><b>Positions and whole-match players</b> <span class="muted">· the plan only puts players in ticked positions</span></summary>
      <div id="posTable" style="margin-top:12px"></div>
    </details>
  </section>

  <section style="display:grid;gap:16px">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-mine" aria-selected="true" data-tab="mine">Check my plan</button>
      <button role="tab" id="t-players" aria-selected="false" data-tab="players">Players</button>
      <button role="tab" id="t-pairs" aria-selected="false" data-tab="pairs">Partnerships</button>
      <button role="tab" id="t-checks" aria-selected="false" data-tab="checks">Data checks</button>
      <button role="tab" id="t-lineups" aria-selected="false" data-tab="lineups">Line-ups</button>
      <button role="tab" id="t-how" aria-selected="false" data-tab="how">How it works</button>
    </div>
    <div id="v-mine"></div>
    <div id="v-players" hidden></div>
    <div id="v-pairs" hidden></div>
    <div id="v-checks" hidden></div>
    <div id="v-lineups" hidden></div>
    <div id="v-how" hidden></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ===== Team Selector: analysis core =====
const Core = (() => {
  const TEAM = 'Blues';
  const GROUPS = ['GK', 'DEF', 'MID', 'WING', 'FOR'];
  const SLOTS = ['GK', 'DEF', 'DEF', 'MID', 'WING', 'WING', 'FOR'];
  const K = 8;            // prior weight in quarters when shrinking toward average
  const MIN_POS_Q = 4;    // quarters at a position before a player is picked there
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const STAT = { '1. Goal': 'G', '2. Assist': 'A', '3. Clean Sheet DEF': 'CD', '4. Clean Sheet GK': 'CG', '5. Star Player': 'SP', '6. Best Passer': 'BP', '7. Concede': 'C' };

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ''));
  }
  function isoDate(s) {
    const m = String(s).trim().match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/);
    if (!m) return null;
    const mo = MONTHS[m[2].toLowerCase()]; if (!mo) return null;
    return `${m[3]}-${String(mo).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  function parseStats(text) { return parseStatsRows(parseCSV(text.replace(/^\uFEFF/, ''))); }
  function parseStatsRows(rows) {
    rows = rows.map(r => r.map(v => v == null ? '' : String(v))).filter(r => r.some(v => v.trim() !== ''));
    const h = rows[0].map(x => x.trim());
    const need = ['Date', 'Age', 'Team', 'League', 'Opponent', 'Result', 'Venue', 'Player', 'Stat', 'Quarter', 'Count', 'MatchID'];
    const miss = need.filter(n => !h.includes(n));
    if (miss.length) throw new Error('This file is missing the columns: ' + miss.join(', ') + '. Upload the KPR Stats export.');
    const ix = Object.fromEntries(need.map(n => [n, h.indexOf(n)]));
    const matches = {}, ev = [];
    for (const r of rows.slice(1)) {
      if ((r[ix.Team] || '').trim() !== TEAM) continue;
      const id = r[ix.MatchID].trim(); if (!id) continue;
      if (!matches[id]) matches[id] = { d: isoDate(r[ix.Date]), age: r[ix.Age].trim(), league: r[ix.League].trim(), opp: r[ix.Opponent].trim(), res: r[ix.Result].trim(), venue: r[ix.Venue].trim() };
      const code = STAT[r[ix.Stat].trim()]; if (!code) continue;
      const player = r[ix.Player].trim().replace(new RegExp('^' + TEAM + '\\s*-\\s*'), '');
      const qm = (r[ix.Quarter] || '').trim().match(/^Q([1-4])$/i);
      ev.push([id, player, code, qm ? +qm[1] : 0, Number(r[ix.Count]) || 0]);
    }
    if (!Object.keys(matches).length) throw new Error('No ' + TEAM + ' rows found in this file.');
    return { uploadedAt: new Date().toISOString(), matches, ev };
  }

  // ---------- Team sheet workbook ----------
  function grp(p) {
    const s = String(p).toUpperCase();
    if (/\bGK\b/.test(s)) return 'GK';
    if (/DEF/.test(s)) return 'DEF';
    if (/[LR]WG|WING/.test(s)) return 'WING';
    if (/MID/.test(s)) return 'MID';
    if (/FOR|\bST\b|STRIKER/.test(s)) return 'FOR';
    return null;
  }
  function parseWorkbook(XLSX, wb) {
    const tabs = [];
    wb.SheetNames.forEach((name, order) => {
      if (/^copy of/i.test(name.trim())) return;
      const ws = wb.Sheets[name];
      const cell = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? x.v : null; };
      // find the PLAYER heading (old layout: column D; new layout: column C) with quarter 1 next to it
      let hr = -1, pc = -1;
      for (let r = 0; r < 25 && hr < 0; r++) for (let c = 0; c < 8; c++) {
        if (String(cell(r, c) || '').trim().toUpperCase() === 'PLAYER' && /^Q?1$/i.test(String(cell(r, c + 1) == null ? '' : cell(r, c + 1)).trim())) { hr = r; pc = c; break; }
      }
      if (hr < 0) return; // not a match tab (tournament, template, table)
      const qc = pc + 1; // first quarter column
      // most layouts give each quarter two columns (1st half, 2nd half); the oldest tabs use one column per quarter
      const step = /^Q?2$/i.test(String(cell(hr, pc + 2) == null ? '' : cell(hr, pc + 2)).trim()) ? 1 : 2;
      const LABELS = /^(on pitch|target|total|gk|def|wg|wing|mid|for|periods?)$/i;
      const p = {};
      for (let r = hr + 1; r <= hr + 20; r++) {
        const raw = cell(r, pc);
        if (typeof raw === 'string' && raw.trim().toUpperCase() === 'PLAYER') break; // a second table starts
        if (typeof raw !== 'string' || !raw.trim()) continue;
        const nm = raw.replace(/\(C\)/i, '').trim();
        if (!/^[A-Za-z][A-Za-z .'-]*$/.test(nm) || LABELS.test(nm)) continue;        const segs = [];
        for (let q = 0; q < 4; q++) {
          const half = {};
          const a = cell(r, qc + step * q), b = step === 2 ? cell(r, qc + 1 + 2 * q) : null;
          if (typeof a === 'string' && a.trim() && a.trim()[0] !== '=') {
            const parts = a.split('|').map(x => x.trim()).filter(Boolean);
            if (parts.length > 1) { half[0] = grp(parts[0].replace(/^0\.5\s*/, '')); half[1] = grp(parts[1].replace(/^0\.5\s*/, '')); }
            else if (/^0\.5/.test(parts[0])) half[0] = grp(parts[0].replace(/^0\.5\s*/, ''));
            else { half[0] = half[1] = grp(parts[0]); }
          }
          if (typeof b === 'string' && b.trim() && b.trim()[0] !== '=') half[1] = grp(b.split('|')[0].replace(/^0\.5\s*/, '').trim());
          for (const h of [0, 1]) if (half[h]) segs.push([q + 1, h, half[h]]);
        }
        if (segs.length && !p[nm]) p[nm] = segs;
      }
      const m = name.match(/(20\d{2,6})/);
      if (m && Object.keys(p).length) tabs.push({ n: name, i: order, dt: m[1], p }); // undated tabs are templates
    });
    if (!tabs.length) throw new Error('No team sheet tabs found. Each match tab needs a PLAYER column with quarters 1-4 across the top.');
    return { uploadedAt: new Date().toISOString(), tabs };
  }

  // ---------- Linking ----------
  const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5);
  function tabDateOK(tab, iso) {
    if (!tab.dt) return false;
    const compact = iso.replace(/-/g, '');
    if (tab.dt.length === 8) return Math.abs(dayDiff(`${tab.dt.slice(0, 4)}-${tab.dt.slice(4, 6)}-${tab.dt.slice(6)}`, iso)) <= 2;
    return compact.startsWith(tab.dt);
  }
  function linkTabs(stats, sheets, config) {
    const links = (config && config.links) || {};
    const byName = Object.fromEntries(sheets.tabs.map(t => [t.n, t]));
    const out = {}, dupes = {};
    const forced = new Set(Object.values(links));
    for (const [id, m] of Object.entries(stats.matches)) {
      if (links[id] === '__none__') { out[id] = null; continue; }
      if (links[id] && byName[links[id]]) { out[id] = byName[links[id]]; continue; }
      const key = m.opp.split(/\s+/)[0].toLowerCase().slice(0, 8);
      const cands = sheets.tabs.filter(t => !forced.has(t.n) && t.n.toLowerCase().includes(key) && tabDateOK(t, m.d)).sort((a, b) => a.i - b.i);
      out[id] = cands[0] || null;
      if (cands.length > 1) dupes[id] = cands.map(t => t.n);
    }
    return { links: out, dupes };
  }

  // ---------- Names ----------
  function nameMapper(stats) {
    const names = [...new Set(stats.ev.map(e => e[1]))].filter(n => n.toLowerCase() !== 'oppo');
    const cache = {};
    return raw => {
      if (cache[raw]) return cache[raw];
      const c = raw.trim().toLowerCase().replace(/\s+/g, ' ');
      let hit = names.find(n => n.toLowerCase() === c);
      if (!hit && !c.includes(' ')) // single name on the team sheet, e.g. HUXLEY -> Huxley M, THEODOR -> Theo

          || names.find(n => { const t = n.split(/\s+/)[0].toLowerCase(); return t.length >= 3 && (c.startsWith(t) || t.startsWith(c)); });
      if (!hit) hit = c.replace(/\b\w/g, x => x.toUpperCase());

  // ---------- Analysis ----------
  function analyse(stats0, sheets, config, ages) {
    const ageSet = new Set(ages);
    const alias = (config && config.aliases) || {}; // e.g. {"Alex": "Alex O"} merges an old name into a new one

    const stats = { ...stats0, ev: stats0.ev.map(e => [e[0], A(e[1]), e[2], e[3], e[4]]) };

    const evBy = {};
    for (const e of stats.ev) (evBy[e[0]] = evBy[e[0]] || []).push(e);

    const matches = Object.entries(stats.matches).map(([id, m]) => {
      const ev = evBy[id] || [];

      for (const [, , code, q, n] of ev) {

    const sel = matches.filter(m => ageSet.has(m.age));
    const withL = sel.filter(m => m.lineup);
    const P = {};
    const pl = n => (P[n] = P[n] || { name: n, apps: 0, halves: 0, pos: { GK: 0, DEF: 0, MID: 0, WING: 0, FOR: 0 }, onGF: 0, onGA: 0, exH: 0, exNet: 0, exGF: 0, exGA: 0, G: 0, A: 0, CD: 0, CG: 0, SP: 0, BP: 0, W: 0, D: 0, L: 0, last: '' });

    let teamHalves = 0, teamGAq = 0, exactQuarters = 0;

    for (const m of sel) if (!m.lineup) checks.noSheet.push(m);
    for (const m of withL) {
      if (dupes[m.id]) checks.dupes.push({ m, tabs: dupes[m.id] });
      if (m.exact) { checks.exactMatches++; exactQuarters += 4; } else checks.noQuarters++;
      const avgHalf = (m.GF - m.GA) / 8;
      const onHalf = {}; // "q-h" -> [[player,pos]]

        const r = pl(p); r.apps++;
        if (m.exact) r.exOffH = (r.exOffH || 0) + 8 - segs.length; r[m.res] = (r[m.res] || 0) + 1; r.last = m.d > r.last ? m.d : r.last;
        for (const [q, h, g] of segs) {
          r.halves++; r.pos[g] += 0.5;
          const hGF = m.qGF[q - 1] / 2, hGA = m.qGA[q - 1] / 2;
          r.onGF += hGF; r.onGA += hGA;
          if (m.exact) { r.exH++; r.exNet += (hGF - hGA) - avgHalf; r.exGF += hGF; r.exGA += hGA; }

        }
      }
      for (let q = 1; q <= 4; q++) {
        const n = ((onHalf[q + '-0'] || []).length + (onHalf[q + '-1'] || []).length) / 2;
        if (n > 7) checks.overfull.push({ m, q, n });

      }
      for (const [key, list] of Object.entries(onHalf)) {
        const q = +key[0];
        const hGF = m.qGF[q - 1] / 2, hGA = m.qGA[q - 1] / 2;
        if (m.exact) timedHalves.push({ set: list.map(x => x[0]), rel: ((hGF - hGA) - avgHalf) * 2, gf: hGF, ga: hGA, d: m.d, opp: m.opp, m: m.id, q, h: +key[2] });
        { // the whole group on the pitch together for this half-quarter
          const sorted = [...list].sort((x, y) => x[0] < y[0] ? -1 : 1);
          const lk = sorted.map(x => x[0]).join('|');
          const lu = (lineups[lk] = lineups[lk] || { players: sorted.map(x => x[0]), roles: {}, halves: 0, gf: 0, ga: 0, exH: 0, exNet: 0, matches: new Set() });
          sorted.forEach(([p, g]) => { lu.roles[p] = lu.roles[p] || {}; lu.roles[p][g] = (lu.roles[p][g] || 0) + 1; });
          lu.halves++; lu.gf += hGF; lu.ga += hGA; lu.matches.add(m.id);
          if (m.exact) { lu.exH++; lu.exNet += (hGF - hGA) - avgHalf; }
        }
        for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
          const [a, b] = [list[i], list[j]].sort((x, y) => x[0] < y[0] ? -1 : 1);
          const k = a[0] + '|' + b[0];
          const role = [a[1], b[1]].sort().join('+');
          for (const rk of ['ANY', role]) {
            const pk = rk + '#' + k;
            const pr = (pairs[pk] = pairs[pk] || { a: a[0], b: b[0], role: rk, halves: 0, gf: 0, ga: 0, exH: 0, exNet: 0 });

            if (m.exact) { pr.exH++; pr.exNet += (hGF - hGA) - avgHalf; }
          }
        }
      }
      for (const [, raw, code, q, n] of m.ev) {
        if (raw.toLowerCase() === 'oppo') continue;
        const r = P[raw];
        if (r && r.apps && ['G', 'A', 'CD', 'CG', 'SP', 'BP'].includes(code)) r[code] += n;
        if (q && ['G', 'A', 'CD', 'CG'].includes(code)) {
          const on = (onHalf[q + '-0'] || []).concat(onHalf[q + '-1'] || []).some(x => x[0] === raw);
          if (!on) checks.offPitch.push({ m, p: raw, code, q });

    }

    const players = Object.values(P).map(r => {
      const Q = r.halves / 2;
      return { ...r, Q, exQ: r.exH / 2, gaPerQ: Q ? (r.G + r.A) / Q : 0, onGFq: Q ? r.onGF / Q : 0, onGAq: Q ? r.onGA / Q : 0, pm: r.exH ? r.exNet / (r.exH / 2) : null, alwaysOn: r.exH > 0 && !r.exOffH, pmShrunk: r.exNet / (r.exH / 2 + K) };
    }).sort((a, b) => b.Q - a.Q);

    // averages for the picker
    const totQ = players.reduce((s, r) => s + r.Q, 0) || 1;
    const avgOut = players.reduce((s, r) => s + r.G + 0.5 * r.A, 0) / totQ;
    const gkQ = players.reduce((s, r) => s + r.pos.GK, 0), defQ = players.reduce((s, r) => s + r.pos.DEF, 0);
    const avgCG = gkQ ? players.reduce((s, r) => s + r.CG, 0) / gkQ : 0;
    const avgCD = defQ ? players.reduce((s, r) => s + r.CD, 0) / defQ : 0;
    const avgGAq = teamHalves ? teamGAq / (teamHalves / 2) : 1;
    for (const r of players) {
      r.out = ((r.G + 0.5 * r.A) + K * avgOut) / (r.Q + K) - avgOut;
      r.gkRate = r.pos.GK ? r.CG / r.pos.GK : null;
      r.defRate = r.pos.DEF ? r.CD / r.pos.DEF : null;
      r.gkAdj = ((r.CG + K * avgCG) / (r.pos.GK + K) - avgCG) * avgGAq;
      r.defAdj = ((r.CD + K * avgCD) / (r.pos.DEF + K) - avgCD) * avgGAq;
    }
    const allPos = {};
    for (const t of sheets.tabs) for (const [raw, segs] of Object.entries(t.p)) {
      const p = nm(raw); allPos[p] = allPos[p] || { GK: 0, DEF: 0, MID: 0, WING: 0, FOR: 0 };
      for (const [, , g] of segs) allPos[p][g] += 0.5;
    }
    const pmOf = {}; players.forEach(r => pmOf[r.name] = r.pm || 0);
    const chem = {};
    const pairList = Object.values(pairs).map(p => {
      const exQ = p.exH / 2;
      // chemistry: how much better the pair does together than their own individual plus-minus suggests
      const c = (p.exNet - exQ * (pmOf[p.a] + pmOf[p.b]) / 2) / (exQ + K);
      const o = { ...p, Q: p.halves / 2, exQ, gfq: p.gf / (p.halves / 2), gaq: p.ga / (p.halves / 2), pm: p.exH ? p.exNet / exQ : null, pmShrunk: p.exNet / (exQ + K), chem: exQ ? c : null };

      mainRole: Object.fromEntries(Object.entries(l.roles).map(([p, rs]) => [p, Object.entries(rs).sort((a, b) => b[1] - a[1])[0][0]])) }));

    const lastResult = matches.length ? matches[matches.length - 1].d.replace(/-/g, '') : '';
    const nextTab = sheets.tabs.filter(t => t.dt.length === 8 && t.dt > lastResult).sort((a, b) => a.dt < b.dt ? -1 : 1)[0];
    const upcoming = nextTab ? { name: nextTab.n, d: `${nextTab.dt.slice(0, 4)}-${nextTab.dt.slice(4, 6)}-${nextTab.dt.slice(6)}`, players: [...new Set(Object.keys(nextTab.p).map(nm))],
      lineup: Object.entries(nextTab.p).reduce((o, [raw, segs]) => { const p = nm(raw); o[p] = (o[p] || []).concat(segs); return o; }, {}) } : null;
    return { matches, sel, withL, players, pairs: pairList, chem, lineups: lineupList, timedHalves, allPos, checks, exactQuarters, latest, upcoming, unlinkedTabs: sheets.tabs.filter(t => !upcoming || t.n !== upcoming.name).filter(t => !Object.values(links).some(x => x && x.n === t.n)), avg: { avgOut, avgCG, avgCD, avgGAq } };
  }

  // ---------- Picker ----------
  function slotScore(r, g) {
    const raw = g === 'GK' ? r.gkAdj : g === 'DEF' ? r.defAdj : r.out;
    const fam = r.pos[g] / (r.pos[g] + K); // individual record counts in proportion to time spent in that role
    const ind = raw * fam;
    return { total: r.pmShrunk + ind, pm: r.pmShrunk, ind, fam };
  }
  const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  // Tries every group of 7 from the available players. For each group it finds the best way to
  // fill the positions, then adds the group's partnership chemistry (all 21 pairs).
  function pickSeven(players, available, chem, weight) {
    chem = chem || {}; weight = weight == null ? 1 : weight;
    let pool = players.filter(r => available.has(r.name));
    if (pool.length < SLOTS.length) return null;
    const val = (r, g) => slotScore(r, g).total - Math.max(0, 1 - r.pos[g] / MIN_POS_Q); // penalty shrinks as time in the role builds
    if (pool.length > 18) pool = pool.map(r => [r, Math.max(...GROUPS.map(g => val(r, g)))]).sort((a, b) => b[1] - a[1]).slice(0, 18).map(x => x[0]);
    const n = pool.length, S = SLOTS.length;
    const V = pool.map(r => SLOTS.map(g => val(r, g)));
    const C = pool.map((a, i) => pool.map((b, j) => i === j ? 0 : (chem[pairKey(a.name, b.name)] || { v: 0 }).v));
    const dp = new Float64Array(1 << S), from = new Int32Array(1 << S);

        if (k === S) continue;
        for (let p = 0; p < S; p++) if (!(mask & (1 << p))) {

    };
    let best = null;
    const idx = [];
    (function choose(start) {
      if (idx.length === S) {
        const base = assign(idx);
        let ch = 0; for (let a = 0; a < S; a++) for (let b = a + 1; b < S; b++) ch += C[idx[a]][idx[b]];
        const total = base + weight * ch / 3; // average pair chemistry, applied to each player
        if (!best || total > best.total) best = { total, base, ch, idx: [...idx] };
        return;
      }
      for (let i = start; i <= n - (S - idx.length); i++) { idx.push(i); choose(i + 1); idx.pop(); }
    })(0);

    assign(best.idx);

    while (mask) { const p = from[mask]; order.unshift(p); mask &= ~(1 << p); }
    const out = order.map((p, k) => { const r = pool[best.idx[p]]; return { slot: SLOTS[k], player: r, score: slotScore(r, SLOTS[k]), experienced: r.pos[SLOTS[k]] >= MIN_POS_Q }; });

    for (let a = 0; a < S; a++) for (let b = a + 1; b < S; b++) { const c = chem[pairKey(names[a], names[b])] || { v: 0, exQ: 0, Q: 0 }; pairs.push({ a: names[a], b: names[b], chem: c.v, exQ: c.exQ, Q: c.Q }); }

  }

  // ---------- Groups: how players who've been on the pitch together have done ----------
  function groupTools(R) {
    const halves = R.timedHalves.map(h => ({ set: new Set(h.set), rel: h.rel, gf: h.gf, ga: h.ga, d: h.d, opp: h.opp }));
    function adj(names, baseRate) {
      baseRate = baseRate || 0;
      let sw = 0, swr = 0;
      for (const h of halves) {
        let o = 0; for (const x of names) if (h.set.has(x)) o++;
        if (o < 2) continue;
        const w = Math.pow(o / 7, 3) * 0.5;
        sw += w; swr += w * h.rel;

      return { adj: sw ? (swr - sw * baseRate) / (sw + K) : 0, weight: sw };
    }
    function story(names) {
      const bySet = {};
      for (const h of halves) {
        const common = names.filter(x => h.set.has(x));
        if (common.length < 3) continue;
        const k = common.slice().sort().join('|');
        const g = (bySet[k] = bySet[k] || { players: common.slice().sort(), halves: 0, gf: 0, ga: 0, dates: new Set() });
        g.halves++; g.gf += h.gf; g.ga += h.ga; g.dates.add(h.d);
      }
      const list = Object.values(bySet);
      for (const g of list) for (const o of list) if (o !== g && o.players.length > g.players.length && g.players.every(p => o.players.includes(p))) { g.halves += o.halves; g.gf += o.gf; g.ga += o.ga; o.dates.forEach(d => g.dates.add(d)); }

      return best ? { players: best.players, quarters: best.halves / 2, gf: best.gf, ga: best.ga, matches: best.dates.size } : null;
    }

  }

  // ---------- Checking a plan you've written yourself ----------
  /*
   * grid: {name: [slot or '' for each half-quarter]} (8 half-quarters)
   * opts: positions, wholeMatch (names), keeper (name, optional)
   * Returns rule checks and the same expected-edge score the planner uses.
   */
  function evaluatePlan(R, grid, opts) {
    opts = opts || {};
    const P = 8, unit = 0.5;
    const names = Object.keys(grid).filter(n => grid[n].some(Boolean));
    const byName = Object.fromEntries(R.players.map(r => [r.name, r]));
    const blank = n => ({ name: n, pos: { GK: 0, DEF: 0, MID: 0, WING: 0, FOR: 0 }, out: 0, gkAdj: 0, defAdj: 0 });
    const rec = n => byName[n] || blank(n);
    const eligOf = n => new Set((opts.positions && opts.positions[n]) || defaultPositions(R, n));
    const GT = groupTools(R);
    const checks = [];
    const add = (ok, text, level) => checks.push({ ok, text, level: level || (ok ? 'ok' : 'bad') });
    const QL = p => 'Q' + (Math.floor(p / 2) + 1) + (p % 2 ? ' (2nd half)' : ' (1st half)');
    const list = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0] || '';

    const shapeProblems = [];
    const periods = [];
    for (let p = 0; p < P; p++) {
      const on = names.filter(n => grid[n][p]).map(n => ({ name: n, slot: grid[n][p] }));
      const c = {}; on.forEach(x => c[x.slot] = (c[x.slot] || 0) + 1);
      const wrong = GROUPS.filter(g => (c[g] || 0) !== need[g]).map(g => `${c[g] || 0} ${g}`);
      if (on.length !== 7) shapeProblems.push(`${QL(p)}: ${on.length} players on the pitch, not 7`);
      else if (wrong.length) shapeProblems.push(`${QL(p)}: ${wrong.join(', ')} (needs 1 GK, 2 DEF, 1 MID, 2 WING, 1 FOR)`);
      const ind = on.reduce((s, x) => s + slotScore(rec(x.name), x.slot).ind, 0);
      const g = GT.adj(on.map(x => x.name), 0);
      periods.push({ lineup: on.sort((a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot)), pred: ind + g.adj, ind, groupAdj: g.adj, story: opts.quick ? null : GT.story(on.map(x => x.name)) });
    }
    if (shapeProblems.length) add(false, 'Line-up shape: ' + shapeProblems.join('; ') + '.');
    else add(true, 'Every half-quarter has 7 players: 1 keeper, 2 defenders, 1 midfielder, 2 wingers and 1 forward.');
    // 2. playing time
    const played = Object.fromEntries(names.map(n => [n, grid[n].filter(Boolean).length * unit]));
    const unused = (opts.squad || []).filter(n => !names.includes(n));
    if (unused.length) add(false, `${list(unused)} ${unused.length === 1 ? 'isn’t' : 'aren’t'} playing at all.`);
    const short = names.filter(n => played[n] < 2);
    if (short.length) add(false, `Under 2 quarters: ${short.map(n => `${n} (${played[n]})`).join(', ')}.`);
    else add(true, 'Everyone plays at least 2 quarters.');
    const whole = new Set((opts.wholeMatch || []).concat(opts.keeper ? [opts.keeper] : []));
    names.forEach(n => { if (played[n] === 4) whole.add(n); });
    const sharers = names.filter(n => !whole.has(n));
    if (sharers.length) {
      const lo = Math.min(...sharers.map(n => played[n])), hi = Math.max(...sharers.map(n => played[n]));
      if (hi - lo > 0.5) add(false, `Playing time isn’t even: ${sharers.filter(n => played[n] === hi).join(', ')} get${sharers.filter(n => played[n] === hi).length === 1 ? 's' : ''} ${hi} quarters, ${sharers.filter(n => played[n] === lo).join(', ')} only ${lo}.`, 'warn');
      else add(true, `Playing time is even: ${lo === hi ? lo : lo + '–' + hi} quarters each for everyone not playing the whole match.`);
    }
    // 3. bench spells
    const cold = [];
    names.forEach(n => { let run = 0, worst = 0; grid[n].forEach(v => { run = v ? 0 : run + 1; worst = Math.max(worst, run); }); if (worst > 2) cold.push(`${n} (${worst * unit} quarters)`); });
    if (cold.length) add(false, `On the bench for more than 1 quarter in a row: ${cold.join(', ')}.`);
    else add(true, 'Nobody sits out more than 1 quarter in a row.');
    // 4. one position per quarter
    const switches = [];
    names.forEach(n => { for (let q = 0; q < 4; q++) { const a = grid[n][2 * q], b = grid[n][2 * q + 1]; if (a && b && a !== b) switches.push(`${n} in Q${q + 1} (${a} then ${b})`); } });
    if (switches.length) add(false, `Changes position during a quarter: ${switches.join(', ')}.`, 'warn');

    if (splits.length) add(false, `Split quarters that could be whole: ${splits.join(', ')}.`, 'warn');

    names.forEach(n => { const e = eligOf(n); const bad = [...new Set(grid[n].filter(v => v && !e.has(v)))]; if (bad.length) offPos.push(`${n} at ${bad.join('/')}`); });

    else add(true, 'Everyone is in a position ticked for them.');
    const perQuarter = periods.reduce((s, x) => s + x.pred, 0) / P;

  // ---------- Critique: weakest spots and changes that would help ----------
  function critiquePlan(R, grid, opts) {

    const seen = new Set(), fixes = [];
    for (const c of cands) { if (seen.has(c.text)) continue; seen.add(c.text); fixes.push(c); if (fixes.length === 5) break; }

    const qv = [0, 1, 2, 3].map(q => base.periods[2 * q].pred + base.periods[2 * q + 1].pred);

    const spots = base.periods[2 * wq].lineup.filter(x => x.slot !== 'GK' || true).map(x => {
      const r = rec(x.name), s = slotScore(r, x.slot);

  // ---------- Match planner ----------

    }
    // can every position be filled in every period?
    const need = {}; SL.forEach(g => need[g] = (need[g] || 0) + 1);
    const problems = [], suggestWhole = [];
    for (const g of GROUPS) {
      const who = all.filter(r => elig[r.name].has(g));
      const supply = who.reduce((s, r) => s + (wholeSet.has(r.name) ? P : Math.min(P, hiCount)), 0);
      if (supply < need[g] * P) {
        if (who.length === need[g] && who.every(r => !wholeSet.has(r.name))) who.forEach(r => suggestWhole.push(r.name));
        const label = { GK: 'in goal', DEF: 'in defence', MID: 'in midfield', WING: 'on the wing', FOR: 'up front' }[g];
        problems.push(who.length
          ? `${need[g] > 1 ? need[g] + ' players are' : 'A player is'} needed ${label} all match, but only ${list(who.map(r => r.name))} ${who.length > 1 ? 'are' : 'is'} ticked for ${g}. With fair playing time ${who.length > 1 ? 'they' : (who[0].name)} can’t cover it. Tick ${g} for more players, or mark ${who.length > 1 ? 'one of them' : who[0].name} to play the whole match.`

    }
    if (problems.length) return { error: problems.join(' '), problems, suggestWhole };
    // value of putting player i (index into all) in slot k
    const USUAL = (name, g) => { const ap = R.allPos[name]; if (!ap) return 0; const t = GROUPS.reduce((s, x) => s + ap[x], 0); return t ? USUAL_W * ap[g] / t : 0; };
    const V = all.map(r => SL.map(g => elig[r.name].has(g) ? indiv(r, g) + USUAL(r.name, g) : -Infinity));
    const memo = new Map();
    const dp = new Float64Array(1 << S7), from = new Int8Array(1 << S7);
    function assign(ids, bonus) {
      dp.fill(-Infinity); dp[0] = 0;
      for (let mask = 0; mask < (1 << S7); mask++) {
        if (dp[mask] === -Infinity) continue;
        let k = 0; for (let t = mask; t; t &= t - 1) k++;
        if (k === S7) continue;
        for (let p = 0; p < S7; p++) if (!(mask & (1 << p))) {
          const v = dp[mask] + V[ids[p]][k] + (bonus ? bonus(ids[p], k) : 0), m2 = mask | (1 << p);

        }
      }

      const slotOf = new Array(S7); let mask = (1 << S7) - 1, k = S7;

    }
    const GT = groupTools(R);
    const groupAdj = (names, baseRate) => GT.adj(names, baseRate);
    const groupStory = names => GT.story(names);
    // team strength of one half-quarter's seven (plus-minus and groupings)
    const halfMemo = new Map();
    function halfInfo(ids) {
      const key = ids.slice().sort((a, b) => a - b).join(',');
      if (halfMemo.has(key)) return halfMemo.get(key);
      const members = ids.concat(fixedIds).map(i => all[i]);
      const baseRate = 0; // individual on/off figures are no longer used
      const g = groupAdj(members.map(r => r.name), baseRate);
      const res = { baseRate, g };
      halfMemo.set(key, res); return res;
    }
    // best positions for players ids onto the free slots in `avail`; val(i,k) scores player i in slot k
    function fill(ids, avail, val) {
      const size = 1 << S7, f = new Float64Array(size).fill(-Infinity), fr = new Int8Array(size);
      f[0] = 0;
      for (let mask = 0; mask < size; mask++) {
        if (f[mask] === -Infinity || (mask & ~avail)) continue;
        let j = 0; for (let t = mask; t; t &= t - 1) j++;
        if (j >= ids.length) continue;
        for (let k = 0; k < S7; k++) if ((avail & (1 << k)) && !(mask & (1 << k))) {
          const v = f[mask] + val(ids[j], k), m2 = mask | (1 << k);
          if (v > f[m2]) { f[m2] = v; fr[m2] = k; }
        }
      }
      return { f, fr, back(mask) { const out = new Array(ids.length); let m = mask; for (let j = ids.length - 1; j >= 0; j--) { const k = fr[m]; out[j] = k; m &= ~(1 << k); } return out; } };
    }
    // Plans one quarter. Players on for both halves keep the same position all quarter;
    // anyone coming off at half-time is replaced in that same position.
    const unitMemo = new Map();
    function unitValue(h1, h2, bonus) {
      const key = h2 ? h1.slice().sort((a, b) => a - b).join(',') + '|' + h2.slice().sort((a, b) => a - b).join(',') : h1.slice().sort((a, b) => a - b).join(',');
      if (!bonus && unitMemo.has(key)) return unitMemo.get(key);
      const full1 = h1.concat(fixedIds), full2 = h2 ? h2.concat(fixedIds) : null;
      const set2 = full2 ? new Set(full2) : new Set(full1), set1 = new Set(full1);
      const C = full1.filter(i => set2.has(i)), A = full1.filter(i => !set2.has(i)), B = full2 ? full2.filter(i => !set1.has(i)) : [];
      const w = full2 ? 2 : 1; // players on for both halves count twice
      const vb = (i, k) => V[i][k] + (bonus ? bonus(i, k) : 0);

    const splitsOf = (on, i) => { let c = 0; for (let q = 0; q + 1 < P; q += 2) if (on[q].has(i) !== on[q + 1].has(i)) c++; return c; };

    const rank = pool.map((r, i) => [i, Math.max(...SL.map((_, k) => V[i][k]))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    let best = null;
    if (S === 0 || n === 0) {
      const per = Array.from({ length: P }, () => []);

    } else for (let restart = 0; restart < 6; restart++) {

      const order = restart === 0 ? rank.slice() : rank.slice().sort(() => rng() - 0.5);
      const per = [];
      for (let p = 0; p < P; p++) { const on = []; for (let j = 0; j < S; j++) on.push(order[(p * S + j) % n]); per.push(on); }

      if (![...Array(n).keys()].every(i => benchOK(onSets, i))) continue;

      if (SPLIT_W) for (let i = 0; i < n; i++) cur -= SPLIT_W * splitsOf(onSets, i);

      const iters = P === 8 ? 12000 : 7000;
      const tryChange = (changes, x, y, d0) => { // changes: [[p, newList]]
        const old = changes.map(([p]) => per[p]);
        changes.forEach(([p, l]) => per[p] = l);
        const units = [...new Set(changes.map(([p]) => unitOf(p)))];
        const nv = units.map(u => unitVal(per, u));
        const d = nv.reduce((s, v, j) => s + v.v - vals[units[j]].v, 0) + d0;
        return { ok: d, apply() { units.forEach((u, j) => vals[u] = nv[j]); cur += d; }, undo() { changes.forEach(([p], j) => per[p] = old[j]); } };
      };
      for (let it = 0; it < iters; it++) {
        const T = 0.3 * Math.pow(0.002 / 0.3, it / iters);
        const p1 = Math.floor(rng() * P);
        if (rng() < 0.6 && P > 1) {

          const xs = per[p1].filter(i => !onSets[p2].has(i)), ys = per[p2].filter(i => !onSets[p1].has(i));
          if (!xs.length || !ys.length) continue;
          const x = xs[Math.floor(rng() * xs.length)], y = ys[Math.floor(rng() * ys.length)];
          const sBefore = SPLIT_W ? splitsOf(onSets, x) + splitsOf(onSets, y) : 0;
          onSets[p1].delete(x); onSets[p1].add(y); onSets[p2].delete(y); onSets[p2].add(x);
          if (!benchOK(onSets, x) || !benchOK(onSets, y)) { onSets[p1].delete(y); onSets[p1].add(x); onSets[p2].delete(x); onSets[p2].add(y); continue; }
          const sAfter = SPLIT_W ? splitsOf(onSets, x) + splitsOf(onSets, y) : 0;
          const t = tryChange([[p1, per[p1].map(i => i === x ? y : i)], [p2, per[p2].map(i => i === y ? x : i)]], x, y, -SPLIT_W * (sAfter - sBefore));

          onSets[p1].delete(x); onSets[p1].add(y);
          if (!benchOK(onSets, x) || !benchOK(onSets, y)) { onSets[p1].delete(y); onSets[p1].add(x); continue; }
          const sAfter = SPLIT_W ? splitsOf(onSets, x) + splitsOf(onSets, y) : 0;
          const t = tryChange([[p1, per[p1].map(i => i === x ? y : i)]], x, y, -SPLIT_W * (sAfter - sBefore));
          if (t.ok >= 0 || rng() < Math.exp(t.ok / T)) { t.apply(); count[x]--; count[y]++; }

    }
    if (!best) return { error: 'Couldn’t find a plan that keeps everyone’s bench spells to 1 quarter. Try adding or removing a player.' };
    if (best.vals.some(v => !v.ok)) {
      return { error: 'The ticked positions can’t be filled in every quarter while keeping playing time fair. Tick more positions for some players, or mark a player to play the whole match.' };
    }

    let prevSlot = {};
    const periods = [];

      const h1 = best.per[P === 8 ? 2 * u : u], h2 = P === 8 ? best.per[2 * u + 1] : null;
      const r = unitValue(h1, h2, (i, k) => prevSlot[i] === SL[k] ? 0.03 : 0);
      const slot = {};
      r.tC.back(r.bestMask).forEach((k, j) => slot[r.C[j]] = SL[k]);
      const rest = ((1 << S7) - 1) & ~r.bestMask;

      if (h2) r.tB.back(rest).forEach((k, j) => slotB[r.B[j]] = SL[k]);
      const halvesHere = h2 ? [[r.full1, slotA], [r.full2, slotB]] : [[r.full1, slotA]];
      halvesHere.forEach(([full, extra]) => {
        const lineup = full.map(i => ({ name: all[i].name, slot: slot[i] || extra[i], isNew: !!all[i].isNew }))
          .sort((x, y) => SL.indexOf(x.slot) - SL.indexOf(y.slot));
        const hi2 = halfInfo(full.filter(i => i < pool.length));
        const ind = full.reduce((s2, i) => s2 + indiv(all[i], slot[i] || extra[i]), 0);
        periods.push({ lineup, pred: hi2.baseRate + ind + hi2.g.adj, baseRate: hi2.baseRate, ind, group: hi2.g, story: groupStory(lineup.map(x => x.name)) });
      });
      prevSlot = {}; (h2 ? r.full2 : r.full1).forEach(i => prevSlot[i] = slot[i] || (h2 ? slotB[i] : slotA[i]));
    }
    const played = {}; squad.forEach(r => played[r.name] = 0);
    periods.forEach(pd => pd.lineup.forEach(x => played[x.name]++));
    const perQuarter = periods.reduce((s, x) => s + x.pred, 0) / P;
    return { periods, played, P, unit, minQ, maxBenchQ, keeper: keeper ? keeper.name : null, whole: fixed.map(r => r.name), perQuarter, infeasible: false,
      elig: Object.fromEntries(Object.entries(elig).map(([k, v]) => [k, [...v]])), squad: squad.map(r => r.name), newPlayers: squad.filter(r => r.isNew).map(r => r.name) };
  }

  return { TEAM, GROUPS, SLOTS, planMatch, evaluatePlan, critiquePlan, groupTools, parseStatsRows, defaultPositions, K, MIN_POS_Q, parseStats, parseWorkbook, analyse, pickSeven, slotScore };
})();

const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v===true?'':v);}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const f1=x=>x==null?'–':x.toFixed(1), f2=x=>x==null?'–':x.toFixed(2);
const sgn=x=>{if(x==null)return'–';const r=Math.round(x*100)/100;return(r>0?'+':r<0?'−':'')+Math.abs(r).toFixed(2);};
const qfmt=x=>Number.isInteger(x)?String(x):x.toFixed(1);
const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});};
const ROLE_C={GK:'var(--r-gk)',DEF:'var(--r-def)',MID:'var(--r-mid)',WING:'var(--r-wing)',FOR:'var(--r-for)'};
const ROLE_N={GK:'in goal',DEF:'in defence',MID:'in midfield',WING:'on the wing',FOR:'up front'};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={db:null,stats:null,sheets:null,config:{links:{}},ages:null,avail:null,tab:'mine',sortP:{k:'Q',d:-1},sortPair:{k:'Q',d:-1},pairRole:'ANY',pairMin:4,canEdit:false,R:null,loaded:{}};

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200);}

// ---------- boot ----------
// Team Selector on GitHub Pages: the data stays in Google and is fetched with your PIN.
const API_URL='https://script.google.com/macros/s/AKfycbyZCUMk5dRigr9tGcKl_7KeBeowe9SzQAtTAIGYoxIcA2XNvs5n58r9ApZWNdoTuXEmIA/exec';
const PIN_KEY='ts-pin';
const pinStore={get(){try{return localStorage.getItem(PIN_KEY)}catch(e){return null}},set(v){try{localStorage.setItem(PIN_KEY,v)}catch(e){}},clear(){try{localStorage.removeItem(PIN_KEY)}catch(e){}}};
async function api(body){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'});
  if(!r.ok)throw new Error('The data service replied with an error ('+r.status+').');
  return r.json();
}
function renderPin(mode,msg){
  $('xiSec').hidden=true;
  const setting=mode==='set';
  const form=el('form',{class:'panel',style:'display:grid;gap:12px;max-width:420px',onsubmit:async e=>{
    e.preventDefault();
    const pin=$('pinIn').value.trim(), pin2=setting?$('pinIn2').value.trim():pin;
    if(!/^\d{6,}$/.test(pin))return renderPin(mode,'Use at least 6 digits.');
    if(pin!==pin2)return renderPin(mode,'The two PINs don’t match.');
    $('pinGo').disabled=true;
    try{
      if(setting){const r=await api({action:'setPin',pin});if(r.error==='pin_already_set')return renderPin('enter','A PIN has already been set. Enter it below.');if(r.error)return renderPin(mode,'Couldn’t set the PIN ('+r.error+').');}
      pinStore.set(pin); load(pin);
    }catch(err){renderPin(mode,'Couldn’t reach your data: '+err.message);}
  }},
    el('h2',{},setting?'Choose a PIN':'Enter your PIN'),
    el('p',{class:'muted',style:'margin:0'},setting?'This protects your players’ data. Use at least 6 digits. You’ll enter it once on each device.':'Enter the PIN you chose for the Team Selector. It’s remembered on this device.'),
    el('label',{for:'pinIn',class:'eyebrow'},'PIN'),
    el('input',{id:'pinIn',type:'password',inputmode:'numeric',autocomplete:'off',class:'btn',style:'font-size:20px;letter-spacing:.2em'}),
    setting?el('label',{for:'pinIn2',class:'eyebrow'},'Type it again'):null,
    setting?el('input',{id:'pinIn2',type:'password',inputmode:'numeric',autocomplete:'off',class:'btn',style:'font-size:20px;letter-spacing:.2em'}):null,
    msg?el('p',{style:'margin:0;color:var(--bad)'},msg):null,
    el('button',{id:'pinGo',type:'submit',class:'btn primary'},setting?'Set PIN and open':'Open'));
  $('evidence').replaceChildren(form);
  setTimeout(()=>{try{$('pinIn').focus()}catch(e){}},50);
}
async function load(pin){
  renderEmpty('Loading your sheets… this can take a few seconds.');
  let d;
  try{d=await api({action:'data',pin});}catch(err){return renderEmpty('Couldn’t reach your data: '+err.message+' Check your connection and reload.');}
  if(d.error==='bad_pin'){pinStore.clear();return renderPin('enter','That PIN wasn’t right.');}
  if(d.error==='locked')return renderEmpty('Too many wrong PINs. The Team Selector is locked for up to an hour. Try again later.');
  if(d.error)return renderEmpty('Couldn’t load your sheets: '+(d.message||d.error));
  try{
    const stats=Core.parseStatsRows(d.statsRows); stats.uploadedAt=d.statsUpdated;
    const XL={utils:{encode_cell:({r,c})=>r+','+c}};
    const wb={SheetNames:d.team.names,Sheets:Object.fromEntries(d.team.names.map(n=>[n,Object.fromEntries(Object.entries(d.team.grids[n]||{}).map(([k,v])=>[k,{v}]))]))};
    const sheets=Core.parseWorkbook(XL,wb); sheets.uploadedAt=d.teamUpdated;
    S.db={doc:p=>({set:async v=>{if(p!=='data/config')return;S.config=v;refresh();const r=await api({action:'saveConfig',pin,config:v});if(r.error)throw new Error(r.error);}})};
    S.saveQuiet=async v=>{const r=await api({action:'saveConfig',pin,config:v});if(r.error)throw new Error(r.error);};
    S.stats=stats; S.sheets=sheets; S.config=d.config||{links:{}}; if(!S.config.links)S.config.links={};
    S.loaded={stats:1,sheets:1,config:1};
    refresh();
  }catch(e){renderEmpty('Couldn’t read your sheets: '+e.message);}
}
(async function boot(){
  S.canEdit=true; S.noUpload=true;
  if(API_URL.startsWith('__'))return renderEmpty('The Team Selector isn’t connected to your Google data yet.');
  const pin=pinStore.get();
  if(pin)return load(pin);
  renderEmpty('Connecting…');
  try{const s=await api({action:'status'});renderPin(s.pinSet?'enter':'set');}
  catch(err){renderEmpty('Couldn’t reach your data: '+err.message);}
})();

function renderEmpty(msg){$('evidence').replaceChildren(el('div',{class:'notice building'},el('span',{class:'dot'}),el('div',{},msg)));$('xiSec').hidden=true;}

function renderStatus(){
  const box=$('status'); box.replaceChildren();
  if(typeof pinStore!=='undefined'&&pinStore.get())box.append(el('button',{type:'button',class:'btn',style:'font-size:13px;padding:5px 10px',onclick:()=>{pinStore.clear();location.reload();}},'Forget PIN on this device'));
  if(S.stats)box.append(el('span',{class:'pill'},'Stats updated ',el('b',{text:fmtDate(S.stats.uploadedAt.slice(0,10))})));
  if(S.sheets)box.append(el('span',{class:'pill'},'Team sheets updated ',el('b',{text:fmtDate(S.sheets.uploadedAt.slice(0,10))})));
  if(S.canEdit&&S.db&&!S.noUpload)box.append(el('button',{class:'btn primary',type:'button',id:'updBtn',onclick:()=>{$('uploadPanel').hidden=!$('uploadPanel').hidden;}},'Update data'));
}

// ---------- uploads ----------
$('csvIn')&&$('csvIn').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file)return;
  try{const doc=Core.parseStats(await file.text());await S.db.doc('data/stats').set(doc);toast(`Saved ${Object.keys(doc.matches).length} Blues matches`);$('uploadPanel').hidden=true;}
  catch(err){toast(err.message||('Couldn’t save the stats ('+err.code+')'));}
  e.target.value='';
});
$('xlsxIn')&&$('xlsxIn').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file)return;
  try{
    if(!window.XLSX)throw new Error('The spreadsheet reader is still loading. Try again in a few seconds.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const doc=Core.parseWorkbook(XLSX,wb);
    await S.db.doc('data/sheets').set(doc);
    toast(`Saved ${doc.tabs.length} team sheet tabs`);$('uploadPanel').hidden=true;
  }catch(err){toast(err.message||('Couldn’t save the team sheets ('+err.code+')'));}
  e.target.value='';
});

// ---------- main render ----------
function refresh(){
  renderStatus();
  if(!(S.loaded.stats&&S.loaded.sheets&&S.loaded.config))return;
  if(!S.stats||!S.sheets){renderEmpty(S.canEdit?'Add your match stats and team sheets with “Update data” to get started.':'No data has been added yet.');if(S.canEdit&&$('uploadPanel'))$('uploadPanel').hidden=false;return;}
  const allAges=[...new Set(Object.values(S.stats.matches).map(m=>m.age))].sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));
  if(!S.ages){const def=(S.config.defaultAges||[]).filter(a=>allAges.includes(a));S.ages=def.length?def:allAges.slice(-1);}
  const seg=$('ages'); seg.replaceChildren(...allAges.map(a=>el('button',{type:'button','aria-pressed':String(S.ages.includes(a)),onclick:()=>{S.ages=S.ages.includes(a)?S.ages.filter(x=>x!==a):[...S.ages,a];if(!S.ages.length)S.ages=[a];refresh();}},a)));
  S.R=Core.analyse(S.stats,S.sheets,S.config,S.ages);
  const R=S.R;
  $('scope').textContent=`${R.sel.length} match${R.sel.length===1?'':'es'} · ${R.withL.length} with a team sheet`;
  $('xiSec').hidden=false;
  renderEvidence(); renderPicker(); renderTab();
}

function renderEvidence(){
  const R=S.R, logged=R.checks.exactMatches, total=R.withL.length;
  const level=logged<6?'early':logged<20?'building':'solid';
  const head={early:'Still learning',building:'Getting there',solid:'Plenty to go on'}[level];
  const body=`You’ve logged which quarter each goal came in for ${logged} of ${total} matches in these seasons. That’s how the page learns which players and groups do well together, so the more matches you log this way, the better its suggestions get. About 20 matches gives it plenty to go on.`;
  const pct=Math.min(100,Math.round(logged/20*100));
  $('evidence').replaceChildren(el('div',{class:'notice '+level},el('span',{class:'dot'}),el('div',{},el('b',{text:head+'. '}),body,el('div',{class:'meter',style:'color:var(--'+(level==='early'?'warn':level==='building'?'accent':'good')+')',title:logged+' of 20 matches'},el('span',{style:'width:'+pct+'%'})))));
}

// ---------- picker ----------
const SPOTS={GK:[[50,88]],DEF:[[27,67],[73,67]],MID:[[50,47]],WING:[[18,30],[82,30]],FOR:[[50,13]]};
const periodLabel=(p,P)=>P===4?'Q'+(p+1):'Q'+(Math.floor(p/2)+1)+(p%2?'b':'a');
function renderPicker(){
  const R=S.R;
  const rated=R.players.map(p=>p.name);
  const up=R.upcoming, nextSquad=up?up.players:null;
  const lastSquad=R.latest?Object.keys(R.latest.lineup):rated;
  const names=[...new Set([...rated,...(nextSquad||[]),...lastSquad])].sort((a,b)=>a.localeCompare(b));
  if(!S.avail){const saved=store.get('bsl-avail');S.avail=new Set(nextSquad||(saved?saved.filter(n=>names.includes(n)):lastSquad));}
  const setSquad=list=>{S.avail=new Set(list);store.set('bsl-avail',[...S.avail]);renderPicker();};
  $('nextSquad').hidden=!up;
  if(up){$('nextSquad').textContent=`Use squad for ${up.name.replace(/\s*20\d{6}.*$/,'')}, ${fmtDate(up.d)}`;$('nextSquad').onclick=()=>setSquad(nextSquad);}
  $('lastSquad').onclick=()=>setSquad(lastSquad);
  $('allPlayers').onclick=()=>setSquad(names);
  $('avail').replaceChildren(...names.map(n=>el('button',{type:'button',class:'chip','aria-pressed':String(S.avail.has(n)),onclick:()=>{S.avail.has(n)?S.avail.delete(n):S.avail.add(n);store.set('bsl-avail',[...S.avail]);renderPicker();}},n,rated.includes(n)?null:el('span',{class:'newtag',title:'No games in the selected seasons yet'},'unrated'))));
  // options
  if(S.chemW==null){const w=store.get('bsl-chemw');S.chemW=(w===0||w===1||w===2)?w:1;}
  if(S.planP==null){const p=store.get('bsl-periods2');S.planP=p===4?4:8;}
  if(S.keeper==null)S.keeper='auto';
  const squad=names.filter(n=>S.avail.has(n));
  const positions=S.config.positions||{};
  const eligOf=n=>positions[n]||Core.defaultPositions(R,n);
  const gkOptions=squad.filter(n=>eligOf(n).includes('GK'));
  if(S.keeper!=='auto'&&S.keeper!=='rotate'&&!gkOptions.includes(S.keeper))S.keeper='auto';
  $('keeperSel').replaceChildren(el('option',{value:'auto'},'Most experienced keeper, all match'),...gkOptions.map(n=>el('option',{value:n},n+', all match')),el('option',{value:'rotate'},'Share the keeper role'));
  $('keeperSel').value=S.keeper; $('keeperSel').onchange=e=>{S.keeper=e.target.value;renderPicker();};
  $('periodsSel').value=String(S.planP); $('periodsSel').onchange=e=>{S.planP=+e.target.value;store.set('bsl-periods2',S.planP);S.showP=0;renderPicker();};
  $('chemW').value=String(S.chemW); $('chemW').onchange=e=>{S.chemW=+e.target.value;store.set('bsl-chemw',S.chemW);renderPicker();};
  const unrated=squad.filter(n=>!rated.includes(n));
  $('unrated').hidden=!unrated.length;
  $('unrated').textContent=unrated.length?`No games yet in the selected seasons for ${unrated.join(', ')}. They’re treated as average players and only placed in the positions ticked for them below.`:'';
  renderPosEditor(squad,eligOf);
  const wholeMatch=(S.config.wholeMatch||[]).filter(n=>squad.includes(n));
  const plan=Core.planMatch(R,{squad,positions,wholeMatch,keeper:S.keeper,periods:S.planP,groupW:S.chemW});
  S.plan=plan;
  if(plan.error){const fixes=(plan.suggestWhole||[]).map(n=>el('button',{type:'button',class:'btn',style:'margin-top:8px;margin-right:8px',disabled:!S.canEdit,onclick:()=>{const wm=[...new Set([...(S.config.wholeMatch||[]),n])];S.db.doc('data/config').set({...S.config,wholeMatch:wm}).catch(e=>toast('Couldn’t save ('+(e.code||e.message)+')'));}},`${n} plays the whole match`));$('planSummary').replaceChildren(el('div',{class:'notice err'},el('span',{class:'dot'}),el('div',{},plan.error,fixes.length?el('div',{},fixes):null)));['planGrid','groupNote','ptabs'].forEach(i=>$(i).replaceChildren());$('pitch').querySelectorAll('.spot').forEach(s=>s.remove());return;}
  renderPlanSummary(plan); renderPlanGrid(plan); renderPitch(plan); renderGroupNote(plan);
}
function playedText(k,P){const q=k*4/P;return qfmt(q);}
function renderPlanSummary(plan){
  const P=plan.P, out=plan.squad.filter(n=>!plan.whole.includes(n)), qs=out.length?out.map(n=>plan.played[n]*4/P):[0];
  const lo=Math.min(...qs), hi=Math.max(...qs), more=out.filter(n=>plan.played[n]*4/P===hi&&hi>lo);
  const others=plan.whole.filter(n=>n!==plan.keeper);
  const kp=(plan.keeper?`${plan.keeper} in goal all match. `:'')+(others.length?`${others.join(' and ')} play${others.length===1?'s':''} the whole match. `:'');
  const els=plan.whole.length?' else':'';
  const share=lo===hi?`Everyone${els} plays ${qfmt(lo)} quarters.`:`Everyone${els} plays ${qfmt(lo)}–${qfmt(hi)} quarters (${more.join(', ')} get${more.length===1?'s':''} ${qfmt(hi)}).`;
  const kids=[el('div',{},el('b',{text:kp+share})),el('div',{},`Expected edge: `,el('b',{class:'num',text:sgn(plan.perQuarter*4)+' goals'}),` over the match compared with an average Blues line-up. `,el('span',{class:'muted'},Math.abs(plan.perQuarter*4)<0.5?'That’s a small edge, so treat the plan as a guide.':''))];
  if(plan.infeasible)kids.push(el('div',{style:'color:var(--bad)'},'Some positions couldn’t be filled from the ticked positions. Tick more positions for some players below.'));
  $('planSummary').replaceChildren(el('div',{class:'notice building'},el('span',{class:'dot'}),el('div',{style:'display:grid;gap:4px'},kids)));
}
function renderPlanGrid(plan){
  const P=plan.P, ORDER={GK:0,DEF:1,MID:2,WING:3,FOR:4};
  const main={};plan.squad.forEach(n=>{const c={};plan.periods.forEach(pd=>{const x=pd.lineup.find(y=>y.name===n);if(x)c[x.slot]=(c[x.slot]||0)+1;});main[n]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'BENCH';});
  const rows=[...plan.squad].sort((a,b)=>((ORDER[main[a]]??9)-(ORDER[main[b]]??9))||a.localeCompare(b));
  const head=P===8
    ?[el('tr',{},el('th',{rowspan:'2'},'Player'),[0,1,2,3].map(q=>el('th',{colspan:'2',style:'text-align:center;border-bottom:0'},'Q'+(q+1))),el('th',{rowspan:'2'},'Quarters')),
      el('tr',{},plan.periods.map((_,p)=>el('th',{style:'text-align:center;font-size:11px'},p%2?'2nd':'1st')))]
    :el('tr',{},el('th',{},'Player'),plan.periods.map((_,p)=>el('th',{style:'text-align:center'},periodLabel(p,P))),el('th',{},'Quarters'));
  const body=rows.map(n=>el('tr',{},el('td',{},el('b',{text:n})),plan.periods.map(pd=>{const x=pd.lineup.find(y=>y.name===n);return el('td',{style:'text-align:center'},x?el('span',{class:'tag',style:'--c:'+ROLE_C[x.slot]+';display:inline-block;min-width:42px',text:x.slot==='WING'?'W':x.slot}):el('span',{class:'muted'},'–'));}),el('td',{},playedText(plan.played[n],P))));
  $('planGrid').replaceChildren(el('div',{class:'tbl'},el('table',{class:'grid'},el('thead',{},head),el('tbody',{},body))));
  $('copyPlan').onclick=async()=>{
    const txt=['Player\t'+plan.periods.map((_,p)=>periodLabel(p,P)).join('\t')+'\tQuarters',...rows.map(n=>n+'\t'+plan.periods.map(pd=>{const x=pd.lineup.find(y=>y.name===n);return x?x.slot:'';}).join('\t')+'\t'+playedText(plan.played[n],P))].join('\n');
    try{await navigator.clipboard.writeText(txt);$('copyMsg').textContent='Copied. Paste it into your team sheet.';$('copyText').hidden=true;}
    catch(e){const t=$('copyText');t.value=txt;t.hidden=false;t.focus();t.select();$('copyMsg').textContent='Select and copy the text below.';}
  };
}
function renderPitch(plan){
  const P=plan.P; if(S.showP==null||S.showP>=P)S.showP=0;
  $('ptabs').replaceChildren(...plan.periods.map((_,p)=>el('button',{type:'button','aria-pressed':String(p===S.showP),onclick:()=>{S.showP=p;renderPitch(plan);}},periodLabel(p,P))));
  const pitch=$('pitch'); pitch.querySelectorAll('.spot').forEach(s=>s.remove());
  const used={};
  plan.periods[S.showP].lineup.forEach(x=>{
    const i=used[x.slot]=(used[x.slot]||0); used[x.slot]++;
    const [l,t]=SPOTS[x.slot][i]||SPOTS[x.slot][0];
    pitch.append(el('div',{class:'spot',style:`left:${l}%;top:${t}%;--c:${ROLE_C[x.slot]}`},el('span',{class:'shirt',text:x.slot==='WING'?'W':x.slot}),el('span',{class:'nm',text:x.name})));
  });
}
function renderGroupNote(plan){
  const P=plan.P, R=S.R, logged=R.checks.exactMatches;
  const listNames=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0]||'';
  const others=plan.whole.filter(n=>n!==plan.keeper);
  const setByYou=[plan.keeper?`${plan.keeper} is in goal all match`:'The keeper role is shared',others.length?`${listNames(others)} play${others.length===1?'s':''} the whole match`:null].filter(Boolean).join('; ')+'. Players only go in positions ticked for them (see “Positions and whole-match players” below).';
  const outQ=plan.squad.filter(n=>!plan.whole.includes(n)).map(n=>plan.played[n]*4/P);
  const lo=Math.min(...outQ),hi=Math.max(...outQ);
  const byRules=`Everyone else plays ${lo===hi?qfmt(lo):qfmt(lo)+'–'+qfmt(hi)} quarters, in whole quarters where possible, keeps one position for the whole quarter, and never sits out more than 1 quarter in a row.`;
  const fromData=logged
    ?`Within those rules, the page chooses who plays together in each quarter, based on how the team did when these players were on the pitch. It can only use the ${logged} match${logged===1?'':'es'} where you logged which quarter goals came in, so for now this is a small nudge, not a firm answer.`
    :'There are no matches yet where you’ve logged which quarter goals came in, so this part isn’t used yet.';
  const quarters=[];
  for(let q=0;q<4;q++){
    const a=plan.periods[P===8?2*q:q], b2=P===8?plan.periods[2*q+1]:null;
    const namesA=a.lineup.map(x=>x.name), namesB=b2?b2.lineup.map(x=>x.name):namesA;
    const off=namesA.filter(n=>!namesB.includes(n)), on=namesB.filter(n=>!namesA.includes(n));
    const st=a.story;
    let line=listNames(namesA)+'.';
    if(off.length)line+=` At half-time ${listNames(on)} replace${on.length===1?'s':''} ${listNames(off)}.`;
    const hist=st?` ${st.players.length} of them (${listNames(st.players)}) have played ${qfmt(st.quarters)} quarter${st.quarters===1?'':'s'} together before: Blues scored ${qfmt(st.gf)}, conceded ${qfmt(st.ga)}.`:' This group hasn’t played together in a logged match yet.';
    quarters.push(el('li',{},el('b',{text:'Q'+(q+1)+': '}),line,el('span',{class:'muted'},hist)));
  }
  $('groupNote').replaceChildren(el('div',{class:'panel',style:'display:grid;gap:10px'},
    el('h3',{},'Why this plan'),
    el('div',{},el('b',{},'Set by you. '),setByYou),
    el('div',{},el('b',{},'Set by the rules. '),byRules),
    el('div',{},el('b',{},'Chosen from your match data. '),fromData),
    el('ul',{style:'margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px'},quarters)));
}
function renderPosEditor(squad,eligOf){
  const positions={...(S.config.positions||{})};
  const save=async()=>{try{await S.db.doc('data/config').set({...S.config,positions});}catch(e){toast('Couldn’t save ('+(e.code||e.message)+')');}};

    el('p',{},'On a new squad with little data, these do almost all the work.'),
    el('h3',{},'How the data nudges the choice'),
    el('p',{},'Within those rules there are many possible plans. The page scores each one using two things, both in goals:'),
    el('p',{},`1. Each player’s record in the position they’re given: clean sheets for keepers and defenders (the team averages are ${Math.round(a.avgCG*100)}% and ${Math.round(a.avgCD*100)}% of quarters), and goals plus half their assists for everyone else.`),
    el('p',{},'2. Groups: if some of the players in a planned line-up have been on the pitch together before, how the Blues did at those times. The more of the same players, the more it counts.'),
